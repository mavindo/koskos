<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Kos and Cost - Find Your Perfect Home. Discover the best boarding houses and rental accommodations near you.">

  <!-- Performance optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://rentkos-api.stg.jtisrv.com">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kos and Cost">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kos and Cost - Find Your Perfect Home</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
    /* Use BrandColors primary gradient (primaryBlue -> primaryTeal) from
      `lib/themes/brand_colors.dart` */
    background: linear-gradient(135deg, #2E86AB 0%, #4FB3A9 100%);
    }
    
    /* Loading container */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
  /* match body gradient so loading overlay blends with app theme (BrandColors) */
  background: linear-gradient(135deg, #2E86AB 0%, #4FB3A9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    /* Logo (improved): use a translucent surface instead of solid white card so the
       icon is visible on the purple gradient background */
    #loading .logo {
      width: 150px;
      height: 150px;
      margin-bottom: 30px;
      /* subtle translucent surface to keep contrast but avoid a full white card */
      background: rgba(255,255,255,0.08);
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      animation: pulse 2s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ensure the image inside the logo scales properly and gets a subtle drop shadow */
    img.logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.22));
    }
    
    /* Loading spinner */
    .spinner {
      width: 50px;
      height: 50px;
      /* spinner uses semi-transparent white to contrast on blue gradient */
      border: 4px solid rgba(255,255,255,0.28);
      border-top: 4px solid rgba(255,255,255,0.95);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    /* Loading text */
    #loading .loading-text {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      animation: fade 1.5s ease-in-out infinite;
    }
    
    /* Animations */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.95); }
    }
    
    @keyframes fade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Hide loading when Flutter is ready */
    .flutter-ready #loading {
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }
  </style>

  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back to the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which won't cause the browser to attempt to load the new url.
    // When the single page app is loaded further down in this file,
    // the correct url will be waiting in the browser's history for
    // the single page app to route accordingly.
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <img class="logo" src="icons/Icon-192.png" alt="Kos and Cost Logo">
    <div class="spinner"></div>
    <p class="loading-text">Loading Kos and Cost...</p>
  </div>

  <script>
    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('flutter-ready');
      setTimeout(function() {
        var loader = document.getElementById('loading');
        if (loader) {
          loader.remove();
        }
      }, 500);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

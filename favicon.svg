<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B5CE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  
  <!-- House roof -->
  <polygon points="8,12 16,4 24,12" fill="white"/>
  
  <!-- House body -->
  <rect x="10" y="12" width="12" height="14" fill="white"/>
  
  <!-- Door -->
  <rect x="14" y="18" width="4" height="8" fill="#2B5CE6"/>
  
  <!-- Window -->
  <rect x="19" y="16" width="2" height="2" fill="#2B5CE6"/>
  
  <!-- Accent dot -->
  <circle cx="21" cy="9" r="1" fill="#FFC107"/>
</svg>